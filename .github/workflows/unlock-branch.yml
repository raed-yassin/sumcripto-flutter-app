name: Unlock PRD branch (after 5PM KSA)
on:
  schedule:
    - cron: '0 14 * * *'  # 5:00 PM KSA -> unlock
  workflow_dispatch: {}

env:
  BRANCH_NAME: main   # <-- change branch name here only

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Debug token presence
        env:
          GH_TOKEN: ${{ secrets.BRANCH_LOCK_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN is EMPTY"
          else
            echo "GH_TOKEN is set, length: ${#GH_TOKEN}"
          fi

      - name: Check token scope
        env:
          GH_TOKEN: ${{ secrets.BRANCH_LOCK_TOKEN }}
        run: |
          gh api user --silent && echo "Token authenticates OK"
          gh api repos/${{ github.repository }} --silent && echo "Token can read this repo OK"

      - name: Check branch protection exists
        env:
          GH_TOKEN: ${{ secrets.BRANCH_LOCK_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/branches/${{ env.BRANCH_NAME }}/protection \
            && echo "Protection exists" \
            || echo "Protection MISSING — this is likely your 404"

      - name: Unlock branch
        id: unlock_step
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BRANCH_LOCK_TOKEN }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/branches/${{ env.BRANCH_NAME }}/protection \
            --input - <<'EOF'
          {
            "required_status_checks": null,
            "enforce_admins": null,
            "required_pull_request_reviews": null,
            "restrictions": null,
            "lock_branch": false
          }
          EOF

      - name: Notify all watchers on failure
        if: steps.unlock_step.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ PRD branch UNLOCK failed - ${new Date().toISOString()}`,
              body: `The scheduled 5PM KSA unlock workflow failed to unlock '${{ env.BRANCH_NAME }}'.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nPlease check branch protection manually — the branch may still be locked.`
            })

      - name: Fail job if unlock failed
        if: steps.unlock_step.outcome == 'failure'
        run: exit 1