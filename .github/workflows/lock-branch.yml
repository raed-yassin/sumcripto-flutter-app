name: Lock branch (9AM-5PM KSA)
on:
  schedule:
    - cron: '0 6 * * *'   # 9:00 AM KSA -> lock
  workflow_dispatch: {}

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Debug token presence
        env:
          GH_TOKEN: ${{ secrets.BRANCH_LOCK_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN is EMPTY"
          else
            echo "GH_TOKEN is set, length: ${#GH_TOKEN}"
          fi

      - name: Check token scope
        env:
          GH_TOKEN: ${{ secrets.BRANCH_LOCK_TOKEN }}
        run: |
          gh api user --silent && echo "Token authenticates OK"
          gh api repos/${{ github.repository }} --silent && echo "Token can read this repo OK"

      - name: Check branch protection exists
        env:
          GH_TOKEN: ${{ secrets.BRANCH_LOCK_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/branches/main/protection \
            && echo "Protection exists" \
            || echo "Protection MISSING — this is likely your 404"

      - name: Lock branch
        env:
          GH_TOKEN: ${{ secrets.BRANCH_LOCK_TOKEN }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/branches/try-block-pushing-9-5/protection \
            -f lock_branch=true \
            --silent