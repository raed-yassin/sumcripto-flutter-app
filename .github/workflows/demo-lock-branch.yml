name: Demo Lock PRD branch (9AM-5PM KSA)
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force this run to fail (to test notification)'
        type: boolean
        default: false

env:
  BRANCH_NAME: main   # <-- change branch name here only

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Debug token presence
        env:
          GH_TOKEN: ${{ secrets.BRANCH_LOCK_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN is EMPTY"
            exit 1
          fi
          echo "GH_TOKEN is set, length: ${#GH_TOKEN}"

      - name: Check token scope
        env:
          GH_TOKEN: ${{ secrets.BRANCH_LOCK_TOKEN }}
        run: |
          gh api user --silent
          gh api repos/${{ github.repository }} --silent

      - name: Check branch protection exists
        env:
          GH_TOKEN: ${{ secrets.BRANCH_LOCK_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/branches/${{ env.BRANCH_NAME }}/protection

      - name: Lock branch
        env:
          GH_TOKEN: ${{ secrets.BRANCH_LOCK_TOKEN }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            echo "Simulating failure for testing purposes"
            exit 1
          fi
          gh api -X PUT repos/${{ github.repository }}/branches/${{ env.BRANCH_NAME }}/protection \
            --input - <<'EOF'
          {
            "required_status_checks": null,
            "enforce_admins": null,
            "required_pull_request_reviews": null,
            "restrictions": null,
            "lock_branch": true
          }
          EOF

      - name: Notify on any failure (only once)
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ PRD branch LOCK workflow failed - ${new Date().toISOString()}`,
              body: `A step failed in the 9AM KSA lock workflow for '${{ env.BRANCH_NAME }}'.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nPlease check the run logs and branch protection manually.`
            })